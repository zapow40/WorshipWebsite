<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrator login — Christ the Rock Covenant Church Camarin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="text-center">
  <div class="hero" style="min-height:70vh; padding:2rem 1rem;">
    <div class="wrap" style="max-width:420px;">
      <div class="hero-badge">Secure administrator sign-in</div>
      <h1 id="hero-title" style="font-family:var(--font-serif); font-size:2rem;">Christ the Rock Covenant Church Camarin</h1>
      <p style="color:var(--ink-soft);">Sign in to the worship library administration panel.</p>

      <div id="login-error" class="toast error hidden mb-3" style="max-width:320px; margin:0 auto;"></div>

      <form id="login-form" class="form-group">
        <div class="form-group" style="text-align:left;">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group" style="text-align:left;">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="submitting" class="btn btn-soft hidden" style="margin-top:.5rem;">Signing in…</button>
        <button type="submit" class="btn btn-full mt-2" style="background:var(--ink); border:none;">Sign in</button>
      </form>
      <p class="text-soft mt-3" style="font-size:.82rem;">This is a private administrative area. No public account registration exists.</p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin-auth.js"></script>
</body>
</html>
