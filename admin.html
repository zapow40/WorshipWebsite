<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worship Library Admin — Christ the Rock Covenant Church Camarin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="#" class="brand" onclick="AdminNav.go('dashboard')">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="17" stroke="currentColor" stroke-width="2" fill="none" />
          <path d="M18 10 L24 16 L20 16 L20 22 L16 22 L16 16 L12 16 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" />
          <circle cx="18" cy="26" r="2" fill="currentColor" />
        </svg>
        <span>Worship Library</span>
      </a>
      <nav class="nav-links" id="admin-nav">
        <a href="#" data-admin-view="dashboard"><span class="icon">▣</span> Dashboard</a>
        <a href="#" data-admin-view="songs"><span class="icon">🎵</span> Songs</a>
        <a href="#" data-admin-view="website"><span class="icon">🎨</span> Website</a>
        <a href="#" data-admin-view="users"><span class="icon">👥</span> Users</a>
        <a href="#" data-admin-view="logs"><span class="icon">📋</span> Logs</a>
      </nav>
    </div>
  </header>

  <div class="wrap admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <strong>Christ the Rock</strong><br /><span class="text-soft">Camarin • Worship Ops</span>
      </div>
      <nav id="sidebar-nav">
        <a href="#" data-admin-view="dashboard" class="active">Dashboard</a>
        <a href="#" data-admin-view="songs">Songs</a>
        <a href="#" data-admin-view="website">Website</a>
        <a href="#" data-admin-view="users">Users</a>
        <a href="#" data-admin-view="logs">Activity logs</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" id="logout-link" class="btn btn-ghost btn-sm">Logout</a>
      </div>
    </aside>

    <section class="admin-main">
      <header class="admin-topbar">
        <h1 id="admin-title">Dashboard</h1>
        <div class="admin-user">
          <span id="admin-user-name">—</span>
          <span id="admin-user-role" class="text-soft">—</span>
        </div>
        <button id="logout-btn" class="btn btn-sm btn-ghost">Logout</button>
      </header>
      <div id="app" class="admin-content"></div>
    </section>
  </div>

  <div id="toast-stack"></div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin-auth.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-dashboard.js"></script>
  <script src="/js/admin-songs.js"></script>
  <script src="/js/admin-settings.js"></script>
  <script src="/js/admin-users.js"></script>
  <script src="/js/admin-logs.js"></script>
</body>
</html>
