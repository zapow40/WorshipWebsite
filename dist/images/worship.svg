<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Intimate crimson worship lighting">
  <defs>
    <radialGradient id="bg" cx="55%" cy="15%" r="100%">
      <stop offset="0" stop-color="#2a0e16"/>
      <stop offset="0.5" stop-color="#140d15"/>
      <stop offset="1" stop-color="#07070b"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e790a0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e790a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5d6fae" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5d6fae" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8556e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c8556e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#07070b" stop-opacity="0"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="590" cy="150" rx="330" ry="220" fill="url(#glow)"/>
    <polygon points="560,-60 700,-60 780,700 590,700" fill="url(#beam)"/>
    <polygon points="820,-60 920,-60 500,700 320,700" fill="url(#beamBlue)"/>
  </g>
  <g opacity="0.5" filter="url(#blur)">
    <ellipse cx="420" cy="540" rx="380" ry="110" fill="#b8455f" opacity="0.2"/>
  </g>
  <rect width="900" height="700" fill="url(#fade)"/>
</svg>
