<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warm praise stage lights">
  <defs>
    <radialGradient id="bg" cx="30%" cy="10%" r="100%">
      <stop offset="0" stop-color="#241d0c"/>
      <stop offset="0.5" stop-color="#121018"/>
      <stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f6d98c" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f6d98c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6b443" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e6b443" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#07080c" stop-opacity="0"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="250" cy="120" rx="300" ry="190" fill="url(#glow)"/>
    <polygon points="120,-60 320,-60 620,700 330,700" fill="url(#beam)"/>
    <polygon points="420,-60 520,-60 760,700 600,700" fill="url(#beam)" opacity="0.65"/>
  </g>
  <g opacity="0.55" filter="url(#blur)">
    <ellipse cx="450" cy="520" rx="420" ry="120" fill="#d9a43c" opacity="0.18"/>
  </g>
  <rect width="900" height="700" fill="url(#fade)"/>
</svg>
